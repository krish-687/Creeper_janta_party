<script>
let votes = Number(localStorage.getItem("cjpVotes")) || 0;

const el = document.getElementById("voteCount");
const sound = document.getElementById("creeperSound");

function format(v){
  return String(v % 100).padStart(2, "0");
}

function animateCount(start, end){
  let current = start;
  const step = Math.ceil((end - start) / 12);

  const interval = setInterval(() => {
    current += step;

    if(current >= end){
      current = end;
      clearInterval(interval);
    }

    el.innerText = format(current);
  }, 25);
}

el.innerText = format(votes);

function addVote(){

  sound.currentTime = 0;
  sound.play();

  const oldVotes = votes;
  votes += 1;

  animateCount(oldVotes, votes);

  localStorage.setItem("cjpVotes", votes);
}

/* 🔥 CREEPER POPUP ADDED */

function closePopup(){
  document.getElementById("creeperPopup").style.display = "none";
}

setTimeout(() => {
  document.getElementById("creeperPopup").style.display = "block";
}, 4000);

</script>
