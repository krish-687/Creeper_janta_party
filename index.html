<script>
let votes = Number(localStorage.getItem("cjpVotes")) || 0;
const el = document.getElementById("voteCount");

function format(v){
  return String(v % 100).padStart(2,"0");
}

el.innerText = format(votes);

/* 🔊 SOUND (fixed autoplay issue) */
function playSound(){
  const audio = new Audio("https://actions.google.com/sounds/v1/cartoon/clang_and_wobble.ogg");
  audio.volume = 0.7;
  audio.play().catch(()=>{});
}

/* 🎆 CONFETTI FIXED */
function confetti(){
  for(let i=0;i<25;i++){
    let c = document.createElement("div");
    c.style.position="fixed";
    c.style.left=Math.random()*100+"vw";
    c.style.top="-20px";
    c.style.width="8px";
    c.style.height="8px";
    c.style.background=["#00ff55","#ffffff","#ffcc00","#ff0077"][Math.floor(Math.random()*4)];
    c.style.zIndex="9999";
    document.body.appendChild(c);

    let fall = setInterval(()=>{
      c.style.top = (parseFloat(c.style.top)+4)+"px";

      if(parseFloat(c.style.top)>window.innerHeight){
        c.remove();
        clearInterval(fall);
      }
    },20);
  }
}

/* 📳 STRONG SHAKE */
function shake(){
  document.body.style.transition="0.1s";
  let x = 10;

  let i = setInterval(()=>{
    document.body.style.transform=`translate(${x}px,0)`;
    x = -x;
  },50);

  setTimeout(()=>{
    clearInterval(i);
    document.body.style.transform="translate(0,0)";
  },300);
}

/* 📈 ANIMATION */
function animate(start,end){
  let cur=start;
  let i=setInterval(()=>{
    cur++;
    el.innerText=format(cur);
    if(cur>=end) clearInterval(i);
  },25);
}

function addVote(){
  let old=votes;
  votes++;

  localStorage.setItem("cjpVotes",votes);

  animate(old,votes);

  playSound();   // 🔊 FIXED
  confetti();    // 🎆 FIXED
  shake();       // 📳 FIXED
}
</script>
